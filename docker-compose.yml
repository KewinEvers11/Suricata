services:
  db:
    image: postgres:18.6
    container_name: suricata-postgres
    environment:
      POSTGRES_DB: suricata_app
      POSTGRES_USER: suricata_appuser
      POSTGRES_PASSWORD: sur1c4t4
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ mounts the data volume at /var/lib/postgresql
      # (before 18 it was /var/lib/postgresql/data).
      - suricata-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suricata_appuser -d suricata_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - suricata-network

  app:
    # La imagen se construye con: ./gradlew bootBuildImage
    image: suricata-app:latest
    container_name: suricata-app
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/suricata_app
      SPRING_DATASOURCE_USERNAME: suricata_appuser
      SPRING_DATASOURCE_PASSWORD: sur1c4t4
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - suricata-network

networks:
  suricata-network:
    driver: bridge

volumes:
  suricata-pgdata:
