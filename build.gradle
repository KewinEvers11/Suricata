plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.kwn'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	// Source: https://mvnrepository.com/artifact/org.flywaydb/flyway-core
	implementation 'org.flywaydb:flyway-core:13.5.0'
	// Source: https://mvnrepository.com/artifact/org.flywaydb/flyway-database-postgresql
	implementation 'org.flywaydb:flyway-database-postgresql:13.5.0'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Builds an OCI/Docker image from the boot jar using Cloud Native Buildpacks (no Dockerfile).
// Run with: ./gradlew bootBuildImage
// Docs: https://docs.spring.io/spring-boot/gradle-plugin/packaging-oci-image.html
tasks.named('bootBuildImage') {
	imageName = 'suricata-app:latest'
}
